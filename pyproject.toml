[project]
name = "google-adk-skills-demo"
version = "2.0.0"
description = "Multi-agent research pipeline: Google ADK agents driven by agentskills.io skill packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-adk>=0.4.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.2.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skills-validate = "skill_runtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skill_runtime", "orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
